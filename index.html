<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق ZAOA - المتجر الراقي للساعات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1c1c1c;
            border: 1px solid #B8860B;
            border-radius: 16px;
            padding: 40px 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        h1 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #B8860B, #d4af37);
            color: #121212;
            font-weight: bold;
            padding: 14px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(184, 134, 11, 0.4);
            width: 100%;
        }
        .download-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #777777;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تطبيق ZAOA</h1>
        <p>يمكنك تحميل التطبيق بسرعة وبصورة آمنة.</p>
        
        <!-- تم تغيير الرابط وإضافة الخاصية download لتبدأ التنزيل الفوري -->
        <a href="https://raw.githubusercontent.com/sarab1k/DK-ZAOA/main/ZAOA.apk" download="ZAOA.apk" class="download-btn">تحميل التطبيق (APK)</a>
        
        <div class="footer">
            جميع الحقوق محفوظة للمطور @NOAH
        </div>
    </div>

</body>
</html>
